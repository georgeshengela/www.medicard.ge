<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; width: 1290px; height: 2796px; background: #1C0A00; }
    .canvas {
      width: 1290px; height: 2796px; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse 120% 70% at 50% 108%, #F9731655 0%, transparent 52%),
        radial-gradient(circle 520px at 12% 8%, #FDBA7422 0%, transparent 60%),
        radial-gradient(circle 420px at 92% 18%, #F9731626 0%, transparent 55%),
        linear-gradient(180deg, #1C0A00 0%, #020617 100%);
    }
    .orb {
      position: absolute; border-radius: 999px; filter: blur(40px); pointer-events: none;
    }
    .orb-a { width: 420px; height: 420px; left: -80px; top: 980px; background: #F9731633; }
    .orb-b { width: 280px; height: 280px; right: -40px; top: 220px; background: #FDBA7428; }
    .copy {
      position: absolute; left: 80px; right: 80px; top: 96px;
      z-index: 3;
    }
    .kicker {
      display: inline-flex; align-items: center; gap: 12px;
      font-family: 'Noto Sans Georgian', sans-serif;
      font-weight: 700; font-size: 26px; letter-spacing: 0.16em;
      color: #FDBA74; margin: 0 0 20px;
    }
    .kicker::before {
      content: ''; width: 36px; height: 3px; border-radius: 99px; background: #F97316;
    }
    .title {
      font-family: 'Noto Sans Georgian', sans-serif;
      font-weight: 800; font-size: 84px; line-height: 1.08;
      color: #fff; margin: 0; white-space: pre-line;
      text-shadow: 0 18px 50px #0008;
    }
    .sub {
      margin: 22px 0 0;
      font-family: 'Noto Sans Georgian', sans-serif;
      font-weight: 500; font-size: 30px; line-height: 1.4;
      color: #D1D5DB;
      max-width: 920px;
    }
    .phone {
      position: absolute;
      left: 50%;
      top: 560px;
      transform: translateX(-50%);
      width: 1080px;
      height: 2280px;
      border-radius: 92px;
      padding: 14px;
      background: linear-gradient(180deg, #1f2937, #030712);
      box-shadow:
        0 0 0 1px #374151,
        0 30px 80px #F9731655,
        0 8px 40px #000a;
      z-index: 2;
    }
    .screen {
      width: 100%; height: 100%; border-radius: 78px; overflow: hidden;
      background: #030712;
    }
    .screen img {
      width: 100%; height: 100%; object-fit: cover; object-position: top center;
      display: block;
    }
    .island {
      position: absolute; left: 50%; top: 26px; transform: translateX(-50%);
      width: 220px; height: 34px; border-radius: 20px; background: #000; z-index: 4;
    }
    .fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 220px;
      background: linear-gradient(180deg, transparent, #1C0A00);
      z-index: 5; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="copy">
      <p class="kicker">სტრიკი</p>
      <h1 class="title">დღეები
ზედიზედ.</h1>
      <p class="sub">ყოველდღიური შესვლა</p>
    </div>
    <div class="phone">
      <div class="island"></div>
      <div class="screen"><img src="file:///C:/Users/User/Desktop/www.medicard/mobile/store/app-store-screens/_raw/08-streak.png" alt="" /></div>
    </div>
    <div class="fade"></div>
  </div>
</body>
</html>
