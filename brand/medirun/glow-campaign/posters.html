<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>MEDIRUN · გაანათე თბილისი — posters</title>
<!--
  One template for every campaign visual. render.py opens ?p=<id>&<params> and screenshots / prints it.
  Dates, Saturday riddles and level numbers live in CONFIG below and must match server/src/data/medirun-campaign.json.
  Owner rules: every poster and story shows "App Store · medicard.ge"; product name is always MEDIRUN; copy addresses the reader as შენ.
-->
<style>
@font-face{font-family:FiraGO;src:url(../fonts/FiraGO-Regular.woff2);font-weight:400}
@font-face{font-family:FiraGO;src:url(../fonts/FiraGO-Medium.woff2);font-weight:500}
@font-face{font-family:FiraGO;src:url(../fonts/FiraGO-SemiBold.woff2);font-weight:600}
@font-face{font-family:FiraGO;src:url(../fonts/FiraGO-Bold.woff2);font-weight:700}
@font-face{font-family:FiraGO;src:url(../fonts/FiraGO-ExtraBold.woff2);font-weight:800}
:root{--ink:#030712;--navy:#071427;--mint:#14B8A6;--mint2:#5EEAD4;--mint3:#99F6E4;--gold:#F59E0B;--gold2:#FCD34D;--red:#F43F5E;--red2:#FDA4AF;--mute:#94A3B8;--dim:#64748B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink)}
body{font-family:FiraGO,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.cv{position:relative;overflow:hidden;background:radial-gradient(900px 700px at 50% 55%,rgba(20,184,166,.26),rgba(20,184,166,0) 70%),radial-gradient(700px 500px at 85% 8%,rgba(245,158,11,.10),transparent 70%),linear-gradient(180deg,#071427 0%,#030712 100%)}
.cv.red{background:radial-gradient(800px 700px at 50% 40%,rgba(244,63,94,.30),rgba(244,63,94,0) 70%),radial-gradient(700px 500px at 85% 8%,rgba(245,158,11,.10),transparent 70%),linear-gradient(180deg,#140713 0%,#030712 100%)}
.cv.rings::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 50%,rgba(94,234,212,.055) 0 2px,transparent 2px 90px);pointer-events:none}
.feed{width:1080px;height:1350px}.story{width:1080px;height:1920px}
.abs{position:absolute}
.brand{font-weight:800;letter-spacing:-1px;white-space:nowrap}.brand b{color:var(--mint);font-style:italic}
.top{position:absolute;display:flex;justify-content:space-between;align-items:center;z-index:5}
.chip{border:2px solid rgba(94,234,212,.5);border-radius:999px;font-weight:700;color:var(--mint3);background:rgba(3,7,18,.55);white-space:nowrap}
.chip.gold{border-color:rgba(252,211,77,.6);color:var(--gold2)}
.chip.red{border-color:rgba(253,164,175,.65);color:var(--red2)}
.eyebrow{font-weight:700;color:var(--mint2);letter-spacing:.5px}
.eyebrow.gold{color:var(--gold2)}.eyebrow.red{color:var(--red2)}
h1{font-weight:800;letter-spacing:-1.5px;line-height:1.04}
.sub{color:#CBD5E1;font-weight:400;line-height:1.35}
.foot{position:absolute;display:flex;justify-content:space-between;color:#7C8BA1;font-weight:600;z-index:5}
.glow-mint{filter:drop-shadow(0 0 30px rgba(45,212,191,.55)) drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.glow-gold{filter:drop-shadow(0 0 40px rgba(251,191,36,.55)) drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.pulse{position:absolute;border-radius:50%;border:3px solid rgba(94,234,212,.55);transform:translate(-50%,-50%)}
.pulse.gold{border-color:rgba(252,211,77,.55)}.pulse.red{border-color:rgba(253,164,175,.55)}
.fade-b{position:absolute;left:0;right:0;background:linear-gradient(180deg,rgba(3,7,18,0) 0%,rgba(3,7,18,.85) 55%,#030712 100%)}
.fade-t{position:absolute;left:0;right:0;top:0;background:linear-gradient(0deg,rgba(3,7,18,0) 0%,rgba(3,7,18,.7) 60%,rgba(3,7,18,.9) 100%)}
.cover{position:absolute;object-fit:cover}
.steps{display:flex;flex-direction:column}
.step{display:flex;align-items:center}
.step .n{font-weight:800;color:var(--mint2)}
.step h3{font-weight:800;letter-spacing:-.5px}
.step p{color:#CBD5E1;line-height:1.35}
.row{display:flex;gap:28px;align-items:flex-start;border-radius:30px;background:rgba(15,23,42,.72);border:2px solid rgba(94,234,212,.22)}
.row.gold{border-color:rgba(252,211,77,.5)}.row.red{border-color:rgba(253,164,175,.55);background:linear-gradient(135deg,rgba(136,19,55,.45),rgba(15,23,42,.85))}
.row .when{flex:none;font-weight:800;color:var(--mint3);line-height:1.15}
.row.gold .when{color:var(--gold2)}.row.red .when{color:var(--red2)}
.row p{color:#E2E8F0;line-height:1.32}
.ladder{display:flex;flex-direction:column}
.lv{display:grid;grid-template-columns:auto 1fr;gap:6px 26px;align-items:center;border-radius:28px;background:rgba(15,23,42,.72);border:2px solid rgba(94,234,212,.2)}
.lv .pc{grid-row:span 2;font-weight:800;color:var(--mint3);text-align:right;font-variant-numeric:tabular-nums}
.lv b{font-weight:800}
.lv span{color:#CBD5E1;line-height:1.3}
.lv.peak{border-color:rgba(253,164,175,.6);background:linear-gradient(135deg,rgba(136,19,55,.5),rgba(15,23,42,.85))}
.lv.peak .pc{color:var(--red2)}
.grid{position:absolute;display:grid;gap:10px}
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:700;white-space:nowrap}
.pill.goldfill{background:linear-gradient(90deg,#F59E0B,#FCD34D);color:#1C1206}
.pill.redfill{background:linear-gradient(90deg,#E11D48,#FB7185);color:#fff}
.pill.mintfill{background:var(--mint);color:#022C29}
.rule{display:flex;gap:22px;align-items:flex-start}
.rule i{flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(20,184,166,.18);color:var(--mint2);font-style:normal;font-weight:800}
.rule p{color:#E2E8F0;line-height:1.32}
.qr{background:#fff;border-radius:18px;display:grid;place-items:center}
.qr svg{display:block;width:100%;height:100%}
.ring{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center}
.print{position:relative;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>
<script src="assets/qrcode.js"></script>
<script>
// ---------- campaign data (keep in sync with server/src/data/medirun-campaign.json) ----------
const Q = new URLSearchParams(location.search);
const CONFIG = {
  name: 'გაანათე თბილისი',
  dates: '5 ოქტომბერი – 31 დეკემბერი',
  teaserDate: '05.10',
  android: Q.get('android') === '1', // re-render with --android once Google Play is live
  qrUrl: 'https://medicard.ge/?utm_source=print&utm_medium=poster&utm_campaign=medirun_glow',
  grand: { day: '31 დეკემბერი', time: '12:00', prize: 'წითელი iPhone 18 Pro Max' },
  levels: [
    ['0,1%', 'ნაპერწკალი', 'პირველი ნიშანი: ქალაქი უკვე შენი წყალობით ანათებს.'],
    ['0,25%', 'ფარანი', 'ნოემბრიდან შაბათობით ფარნის ყუთებს დაინახავ — თითოში 1 500 Medi Coins.'],
    ['0,5%', 'ჩირაღდანი', 'შუქურამდე ნახევარი გზაღა დაგრჩა.'],
    ['1%', 'შუქურა', '31 დეკემბერს წითელ iPhone 18 Pro Max-ს დაინახავ.'],
  ],
  // Saturday 16:00 rain. Riddles reveal the park at 15:00 and 15:30 in stories.
  saturdays: [
    { date: '2026-10-10', day: '10 ოქტომბერი', label: 'შაბათს, 10 ოქტომბერს', park: 'rike' },
    { date: '2026-10-17', day: '17 ოქტომბერი', label: 'შაბათს, 17 ოქტომბერს', park: 'vake' },
    { date: '2026-10-24', day: '24 ოქტომბერი', label: 'შაბათს, 24 ოქტომბერს', park: 'lisi' },
    { date: '2026-10-31', day: '31 ოქტომბერი', label: 'შაბათს, 31 ოქტომბერს', park: 'april9' },
    { date: '2026-11-07', day: '7 ნოემბერი', label: 'შაბათს, 7 ნოემბერს', park: 'vake', lantern: true },
    { date: '2026-11-14', day: '14 ნოემბერი', label: 'შაბათს, 14 ნოემბერს', park: 'rike', lantern: true },
    { date: '2026-11-21', day: '21 ნოემბერი', label: 'შაბათს, 21 ნოემბერს', park: 'lisi', lantern: true },
    { date: '2026-11-28', day: '28 ნოემბერი', label: 'შაბათს, 28 ნოემბერს', park: 'april9', lantern: true },
    { date: '2026-12-05', day: '5 დეკემბერი', label: 'შაბათს, 5 დეკემბერს', park: 'vake', lantern: true },
    { date: '2026-12-12', day: '12 დეკემბერი', label: 'შაბათს, 12 დეკემბერს', park: 'rike', lantern: true },
    { date: '2026-12-19', day: '19 დეკემბერი', label: 'შაბათს, 19 დეკემბერს', park: 'lisi', lantern: true },
    { date: '2026-12-26', day: '26 დეკემბერი', label: 'შაბათს, 26 დეკემბერს', park: 'april9', lantern: true },
  ],
  riddles: {
    rike: ['პარკი მტკვრის პირას, საიდანაც საბაგირო ციხისკენ ადის.', 'მშვიდობის ხიდის ბოლოს, მარცხენა ნაპირზე.'],
    vake: ['დიდი პარკი ჭავჭავაძის გამზირის ბოლოს, სადაც კიბე ტყისკენ ადის.', 'ქვედა ნაწილში, დიდ მრგვალ შადრევანთან.'],
    lisi: ['ტბა ქალაქის ჩრდილო-დასავლეთით, რომლის გარშემოც შაბათობით დარბიან.', 'ნაპირის ბილიკზე, მთავარი შესასვლელის მხარეს.'],
    april9: ['ბაღი რუსთაველზე, რომელიც თარიღის სახელს ატარებს.', 'რუსთაველის გამზირის გასწვრივ, ხეების ჩრდილში.'],
  },
  weeks: [
    { n: 1, dates: '5–11 ოქტომბერი', chapter: 'oldtown', title: 'ძველი ქალაქის ამბები', sub: 'ამ კვირაში მეტი ყუთი მოედნებთან, ხიდებთან და აბანოებთან.', sat: 0 },
    { n: 2, dates: '12–18 ოქტომბერი', chapter: 'green', title: 'მწვანე თბილისი', sub: 'ამ კვირაში მეტი ყუთი ბაღებსა და პარკებში.', sat: 1 },
    { n: 3, dates: '19–25 ოქტომბერი', chapter: 'horizon', title: 'წყალი და ჰორიზონტი', sub: 'ამ კვირაში მეტი ყუთი ტბებთან და ქალაქის გადასახედებთან.', sat: 2 },
    { n: 4, dates: '26 ოქტომბერი – 1 ნოემბერი', chapter: 'culture', title: 'ქალაქის ხელწერა', sub: 'ამ კვირაში მეტი ყუთი სამებასთან, ბოტანიკურ ბაღთან და რუსთაველზე.', sat: 3 },
  ],
  november: [['2–8', 'გლდანი, ნაძალადევი'], ['9–15', 'დიდუბე, ჩუღურეთი, საბურთალო'], ['16–22', 'ისანი, სამგორი'], ['23–29', 'ვაკე, მთაწმინდა, კრწანისი']],
};
const CH = {
  oldtown: ['freedom','orbeliani','gabriadze','peace','rike','metekhi','abanotubani','gudiashvili'],
  green: ['vake','mziuri','vera','dedaena','april9','mushtaidi','kikvidze','dighomi'],
  horizon: ['turtle','lisi','mtatsminda','mother','chronicle'],
  culture: ['sameba','botanical','opera'],
};
const G = n => `../gen/${n}_cut.png`;
const stores = () => CONFIG.android ? 'App Store · Google Play · medicard.ge' : 'App Store · medicard.ge';
const satIdx = () => Math.max(0, Math.min(CONFIG.saturdays.length - 1, +(Q.get('s') || 0)));

// ---------- helpers ----------
function qrSvg(text, dark = '#030712') {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 2; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges"><path fill="${dark}" d="${d}"/></svg>`;
}
function rings(x, y, sizes, tone = '') { return sizes.map((s, i) => `<div class="pulse ${tone}" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;opacity:${(1 - i / sizes.length) * .9}"></div>`).join(''); }
const header = (pad, chip, cls = '', size = 40) => `<div class="top" style="top:${pad}px;left:${pad + 10}px;right:${pad + 10}px"><div class="brand" style="font-size:${size}px">MEDI<b>RUN</b></div>${chip ? `<div class="chip ${cls}" style="font-size:${size * .7}px;padding:${size * .3}px ${size * .65}px">${chip}</div>` : ''}</div>`;
// photos fade into the canvas through their own alpha, so no overlay seam shows against the gradient background
const MASK = '-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 97%)';
const MASK_UP = '-webkit-mask-image:linear-gradient(0deg,#000 60%,transparent 100%)';
const foot = (pad, size = 26, bottom = 52) => `<div class="foot" style="left:${pad}px;right:${pad}px;bottom:${bottom}px;font-size:${size}px"><span>MEDICARD აპში · უფასოდ</span><span>${stores()}</span></div>`;

// ---------- posters ----------
const P = {};
const STEPS = [
  ['01', 'ui_puck', 'ჩართე MEDIRUN', 'გახსენი MEDICARD და დაიწყე სიარული ან სირბილი.'],
  ['02', 'ui_i_pulse', 'იგრძენი პულსი', 'საჩუქართან მიახლოებისას ტელეფონი გულისცემასავით აკანკალდება. რაც უფრო ახლოს ხარ, მით უფრო ჩქარა.'],
  ['03', 'ui_gift_open', 'გახსენი ყუთი', 'ადგილზე ჩართე კამერა, იპოვე ყუთი და შეეხე. Medi Coins ავტომატურად ჩაირიცხება.'],
];
const RULES = [
  'ყუთები მხოლოდ საჯარო ბილიკებზეა — არასოდეს გზაზე, ეზოში ან დახურულ ტერიტორიაზე.',
  'ქუჩის გადაკვეთისას ეკრანს ნუ უყურებ — პულსს ხელში იგრძნობ.',
  'საღამოს ყუთები მხოლოდ განათებულ ადგილებშია.',
  'სხვებს ნუ უბიძგებ: შაბათის წვიმაში ყუთები ბევრს ეყოფა.',
  'დიდ საჩუქარს აპში ნაჩვენები კოდითა და პირადობის მოწმობით გადმოგცემთ.',
];

// F00 teaser
P['f00-teaser'] = { kind: 'feed', html: () => `
  <img class="cover" src="assets/city.jpg" style="left:0;top:0;width:1080px;height:1350px;object-position:66% 50%;filter:brightness(.32) saturate(.5)">
  <div class="abs" style="inset:0;background:radial-gradient(460px 460px at 50% 46%,rgba(45,212,191,.18),transparent 70%)"></div>
  <div class="abs" style="left:0;right:0;top:390px;text-align:center">
    <h1 style="font-size:124px">რაღაც<br>აინთება.</h1>
    <div style="margin-top:50px;font-size:150px;font-weight:800;color:transparent;-webkit-text-stroke:3px var(--mint2);letter-spacing:4px;text-shadow:0 0 40px rgba(45,212,191,.5)">${CONFIG.teaserDate}</div>
  </div>
  <div class="abs brand" style="left:0;right:0;top:80px;text-align:center;font-size:44px;opacity:.9">MEDI<b>RUN</b></div>
  ${foot(80)}` };

// F01 key visual
P['f01-key'] = { kind: 'feed', html: () => `
  <img class="cover" src="assets/city.jpg" style="left:0;top:0;width:1080px;height:900px;object-position:62% 50%;${MASK}">
  <div class="fade-t" style="height:260px"></div>
  ${rings(600, 470, [180, 300, 430, 560])}
  <img class="abs glow-mint" src="${G('ui_gift')}" style="left:480px;top:330px;width:250px;transform:rotate(-6deg)">
  ${header(70, CONFIG.name)}
  <div class="abs" style="left:80px;right:80px;bottom:130px">
    <div class="eyebrow" style="font-size:31px;margin-bottom:18px">${CONFIG.dates} · მთელ თბილისში</div>
    <h1 style="font-size:92px">ქალაქში საჩუქრებია დამალული.</h1>
    <p class="sub" style="font-size:34px;margin-top:24px">ჩართე MEDIRUN და გაისეირნე. საჩუქართან ტელეფონს გული აუჩქარდება.</p>
  </div>${foot(80)}` };

// F02 how it works
P['f02-how'] = { kind: 'feed', cls: 'rings', html: () => `${header(70, CONFIG.name)}
  <div class="abs" style="left:80px;right:80px;top:190px"><div class="eyebrow" style="font-size:30px">3 ნაბიჯი</div><h1 style="font-size:96px;margin-top:10px">როგორ ვიპოვო?</h1></div>
  <div class="steps abs" style="left:70px;right:80px;top:420px;gap:34px">${STEPS.map(([n, ic, t, p]) => `
    <div class="step" style="gap:34px"><img class="glow-mint" src="${G(ic)}" style="width:210px;flex:none">
      <div><div class="n" style="font-size:28px">${n}</div><h3 style="font-size:54px;margin:4px 0 10px">${t}</h3><p style="font-size:30px">${p}</p></div></div>`).join('')}
  </div>${foot(80)}` };

// F03 weekly rhythm
const RHYTHM = [
  ['', 'ორშაბათი–<br>პარასკევი', 'მცირე ყუთები 08:30-სა და 18:00-ზე: 50–250 Medi Coins.'],
  ['', 'შაბათი–<br>კვირა', 'უფრო დიდი ყუთები 10:30-სა და 17:30-ზე: 150–500 Medi Coins.'],
  ['gold', 'შაბათს,<br>16:00', 'საჩუქრების წვიმა ერთ პარკში. რომელში — საათით ადრე გეტყვით.'],
  ['red', '31<br>დეკემბერი', `${CONFIG.grand.prize} — მხოლოდ შუქურებისთვის.`],
