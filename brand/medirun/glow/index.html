<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>MEDIRUN Glow</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
<style>
  :root { --mint: #5EEAD4; --ink: #E6F4F1; --glass: rgba(9, 14, 24, .62); }
  html, body { margin: 0; height: 100%; background: #0B111C; color: var(--ink); font-family: "FiraGO", "Noto Sans Georgian", system-ui, sans-serif; overflow: hidden; }
  #map { position: fixed; inset: 0; }
  .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { opacity: .35; }

  /* Miniature look: blur the far and near band, keep the middle sharp. */
  .tilt { position: fixed; left: 0; right: 0; pointer-events: none; -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); transition: opacity .6s; }
  .tilt.top { top: 0; height: 36%; -webkit-mask-image: linear-gradient(#000 0 30%, transparent); mask-image: linear-gradient(#000 0 30%, transparent); }
  .tilt.bottom { bottom: 0; height: 26%; -webkit-mask-image: linear-gradient(transparent, #000 75%); mask-image: linear-gradient(transparent, #000 75%); }
  body.flat .tilt { opacity: 0; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 55%, transparent 55%, rgba(4, 7, 13, .7)); }

  .brand { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 16px; pointer-events: none; }
  .brand b { display: block; font-weight: 800; letter-spacing: .14em; font-size: 15px; color: var(--mint); text-shadow: 0 0 14px rgba(45, 212, 191, .7); }
  .brand span { font-size: 12px; opacity: .7; }
  .fps { position: fixed; bottom: 4px; right: 8px; font: 11px ui-monospace, monospace; opacity: .5; }

  .hud { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .stats { display: flex; gap: 10px; }
  .stat { background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(94, 234, 212, .18); border-radius: 16px; padding: 8px 14px; min-width: 92px; text-align: center; }
  .stat b { display: block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; opacity: .7; }
  .stat.warm b { color: #FFD08A; text-shadow: 0 0 12px rgba(255, 170, 80, .55); }
  .stat.cool b { color: var(--mint); text-shadow: 0 0 12px rgba(45, 212, 191, .55); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(230, 244, 241, .14); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
  button.primary { background: #0D9488; border-color: #2DD4BF; font-weight: 700; padding: 10px 22px; box-shadow: 0 0 24px rgba(45, 212, 191, .45); }
  button[aria-pressed="true"] { border-color: var(--mint); color: var(--mint); }
  .chips { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .chips button { font-size: 11px; padding: 6px 11px; }
  .stat.pop b { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .bar button:not(.primary) { min-width: 44px; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 13px; opacity: .8; transition: opacity .8s; }
  .loading.done { opacity: 0; }

  .runner { width: 64px; height: 64px; pointer-events: none; }
  .runner canvas { width: 64px; height: 64px; display: block; }
  .runner::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 46px; height: 16px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(94, 234, 212, .75), transparent); filter: blur(2px); }
</style>
</head>
<body>
<div id="map"></div>
<div class="tilt top"></div>
<div class="tilt bottom"></div>
<div class="vignette"></div>
<div class="brand"><b>MEDIRUN</b><span>ძველი თბილისი · პროტოტიპი</span></div>
<div class="fps" id="fps"></div>
<div class="loading" id="loading">ქალაქი იტვირთება…</div>
<div class="hud">
  <div class="stats">
    <div class="stat cool"><b id="km">0.00</b><span>კმ</span></div>
    <div class="stat warm"><b id="lit">0</b><span>აინთო შენობა</span></div>
  </div>
  <div class="bar">
    <button id="restart" aria-label="თავიდან">↺</button>
    <button class="primary" id="play">▶ სირბილი</button>
    <button id="speed" aria-label="სიჩქარე">×6</button>
  </div>
</div>
<div class="chips">
  <button id="cam" aria-pressed="true">მიყოლა</button>
  <button id="tilt" aria-pressed="true">მინიატურა</button>
</div>
<script type="module" src="glow.js"></script>
</body>
</html>
