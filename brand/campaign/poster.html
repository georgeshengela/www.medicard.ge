<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8" />
<title>MEDICARD campaign poster</title>
<style>
  @font-face { font-family: FiraGO; font-weight: 400; src: url(../../server/public/fonts/firago/FiraGO-Regular.woff2) format('woff2'); }
  @font-face { font-family: FiraGO; font-weight: 500; src: url(../../server/public/fonts/firago/FiraGO-Medium.woff2) format('woff2'); }
  @font-face { font-family: FiraGO; font-weight: 600; src: url(../../server/public/fonts/firago/FiraGO-SemiBold.woff2) format('woff2'); }
  @font-face { font-family: FiraGO; font-weight: 700; src: url(../../server/public/fonts/firago/FiraGO-Bold.woff2) format('woff2'); }
  @font-face { font-family: FiraGO; font-weight: 800; src: url(../../server/public/fonts/firago/FiraGO-ExtraBold.woff2) format('woff2'); }
  :root { --teal: #14B8A6; --teal2: #2DD4BF; --foam: #99F6E4; --deep: #042F2E; --ink: #0B2B2E; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: FiraGO, system-ui, sans-serif; background: #000; -webkit-font-smoothing: antialiased; }
  #poster { position: relative; overflow: hidden; color: #fff; }
  .abs { position: absolute; }
  .photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 56px; height: 56px; border-radius: 15px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }
  .brand b { font-weight: 800; font-size: 26px; letter-spacing: .08em; display: block; }
  .brand span { display: block; font-weight: 500; font-size: 15px; opacity: .8; }
  .kicker { display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px 9px 13px; border-radius: 999px;
    background: rgba(20,184,166,.22); border: 1px solid rgba(153,246,228,.45); font-weight: 600; font-size: 21px; color: #E6FFFA; }
  .kicker i { width: 10px; height: 10px; border-radius: 50%; background: var(--teal2); box-shadow: 0 0 0 6px rgba(45,212,191,.25); }
  .light .kicker { background: rgba(13,148,136,.1); border-color: rgba(13,148,136,.3); color: #0F766E; }
  h1 { font-weight: 800; line-height: 1.1; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--foam); }
  .sub { font-weight: 500; line-height: 1.42; color: rgba(255,255,255,.88); }
  .light .sub { color: #3E5A5D; }
  .cta { display: flex; align-items: center; gap: 16px; }
  .cta img { height: 58px; display: block; }
  .cta .free { font-weight: 700; font-size: 20px; color: var(--foam); line-height: 1.25; }
  .cta .free small { display: block; font-weight: 500; font-size: 15px; color: rgba(255,255,255,.72); }
  .light .cta .free { color: #0F766E; } .light .cta .free small { color: #5B7275; }
  .phone { position: absolute; border-radius: 58px; padding: 12px; background: linear-gradient(145deg, #6b6f76, #1d1f23 40%, #4b4e54);
    box-shadow: 0 50px 100px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.08) inset; }
  .phone img { display: block; width: 100%; border-radius: 47px; }
  .phone::after { content: ''; position: absolute; top: 26px; left: 50%; width: 30%; height: 30px; margin-left: -15%; border-radius: 20px; background: #000; }
  .checks { display: grid; gap: 14px; }
  .checks div { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 24px; }
  .checks div i { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--teal); display: grid; place-items: center; font-style: normal; font-size: 18px; color: #fff; font-weight: 800; }
  .brandbg { position: absolute; inset: 0; background: radial-gradient(900px 700px at 85% 20%, rgba(45,212,191,.35), transparent 60%),
    radial-gradient(700px 600px at 0% 100%, rgba(20,184,166,.25), transparent 60%), linear-gradient(160deg, #0B3B3A 0%, #042F2E 55%, #03201F 100%); }
  .rings { position: absolute; border-radius: 50%; border: 2px solid rgba(153,246,228,.12); }
  .lightbg { position: absolute; inset: 0; background: radial-gradient(800px 600px at 90% 0%, rgba(45,212,191,.18), transparent 60%), linear-gradient(180deg, #F3FBF9, #E8F5F2); }
  .tipcard { display: flex; gap: 18px; align-items: flex-start; background: #fff; border-radius: 24px; padding: 22px 24px; box-shadow: 0 10px 30px rgba(11,43,46,.07); }
  .tipcard b { flex: none; width: 44px; height: 44px; border-radius: 14px; background: rgba(13,148,136,.12); color: #0F766E; display: grid; place-items: center; font-size: 22px; font-weight: 800; }
  .tipcard p { font-size: 25px; line-height: 1.38; font-weight: 600; color: var(--ink); padding-top: 5px; }
  .icon { display: grid; place-items: center; border-radius: 36px; background: #fff; box-shadow: 0 16px 40px rgba(11,43,46,.1); }
  .foot { font-size: 17px; font-weight: 500; }
  .opt { display: flex; align-items: center; gap: 18px; padding: 22px 26px; border-radius: 22px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); font-size: 28px; font-weight: 700; }
  .opt b { width: 46px; height: 46px; border-radius: 14px; background: var(--teal); display: grid; place-items: center; font-size: 22px; }
  .pill { display: inline-block; padding: 14px 26px; border-radius: 999px; background: #fff; color: #0F766E; font-weight: 800; font-size: 26px; }
  .light { color: var(--ink); }
  .light h1 { color: var(--ink); } .light h1 em { color: #0F766E; }
</style>
</head>
<body>
<div id="poster"></div>
<script>
const ICON = '../../server/public/icon.png';
const BADGE = '../../server/public/icons/app-store-badge.svg';
const SCREENS = '../../server/public/screens/';
const photoUrl = (p) => (p.includes('/') ? p : `photos/${p}.png`);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const brand = (sub = 'AI · ჯანმრთელობის აპი') => `<div class="brand"><img src="${ICON}" alt=""><div><b>MEDICARD</b><span>${esc(sub)}</span></div></div>`;
const cta = (free = 'უფასოდ', small = 'App Store-ში') => `<div class="cta"><img src="${BADGE}" alt=""><div class="free">${esc(free)}<small>${esc(small)}</small></div></div>`;
const kicker = (t) => (t ? `<div class="kicker"><i></i>${esc(t)}</div>` : '');
const rings = (x, y, r) => [1, 1.35, 1.7].map((k) => `<div class="rings" style="left:${x - r * k}px;top:${y - r * k}px;width:${2 * r * k}px;height:${2 * r * k}px"></div>`).join('');

const T = {
  photo: (d) => [1080, 1350, `
    <div class="photo" style="background-image:url(${photoUrl(d.photo)})"></div>
    <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(4,24,27,.55) 0%,rgba(4,24,27,0) 20%,rgba(4,24,27,0) 45%,rgba(4,24,27,.82) 72%,rgba(4,24,27,.96) 100%)"></div>
    <div class="abs" style="left:56px;top:52px">${brand()}</div>
    <div class="abs" style="left:56px;right:56px;bottom:60px">
      ${kicker(d.kicker)}
      <h1 style="font-size:58px;margin-top:22px;max-width:900px">${esc(d.headline)}</h1>
      <p class="sub" style="font-size:25px;margin-top:16px;max-width:820px">${esc(d.sub)}</p>
      <div style="margin-top:30px">${cta()}</div>
    </div>`],
  screen: (d) => [1080, 1350, `
    <div class="brandbg"></div>${rings(820, 700, 300)}
    <div class="abs" style="left:56px;top:52px">${brand()}</div>
    <div class="phone" style="left:590px;top:330px;width:420px;transform:rotate(6deg)"><img src="${SCREENS}${d.screen}"></div>
    <div class="abs" style="left:56px;top:200px;width:520px">
      ${kicker(d.kicker)}
      <h1 style="font-size:56px;margin-top:24px">${esc(d.headline)}</h1>
      <p class="sub" style="font-size:23px;margin-top:18px">${esc(d.sub)}</p>
      <div class="checks" style="margin-top:34px">${(d.bullets || []).map((b) => `<div><i>✓</i>${esc(b)}</div>`).join('')}</div>
    </div>
    <div class="abs" style="left:56px;bottom:60px">${cta()}</div>`],
  tip: (d) => [1080, 1350, `
    <div class="lightbg"></div>
    <div class="abs light" style="left:56px;top:52px">${brand('AI · რჩევა ჯანმრთელობისთვის')}</div>
    <div class="abs light" style="left:56px;right:56px;top:150px;bottom:150px;display:flex;flex-direction:column;justify-content:center">
      <div style="display:flex;align-items:center;gap:26px">
        <div class="icon" style="width:140px;height:140px;font-size:76px">${d.icon || '💡'}</div>
        ${kicker(d.kicker)}
      </div>
      <h1 style="font-size:66px;margin-top:40px">${esc(d.headline)}</h1>
      <div style="display:grid;gap:20px;margin-top:46px">${(d.bullets || []).map((b, i) => `<div class="tipcard" style="padding:28px 30px"><b>${i + 1}</b><p style="font-size:29px">${esc(b)}</p></div>`).join('')}</div>
    </div>
    <div class="abs light" style="left:56px;right:56px;bottom:52px;display:flex;align-items:flex-end;justify-content:space-between;gap:30px">
      <p class="foot" style="color:#5B7275;max-width:560px">ℹ️ ${esc(d.footnote)}</p>
      <div class="cta"><img src="${BADGE}" alt="" style="height:52px"></div>
    </div>`],
  statement: (d) => [1080, 1350, `
    <div class="brandbg"></div>${rings(900, 260, 260)}
    <div class="abs" style="left:56px;top:52px">${brand()}</div>
    <div class="abs" style="left:56px;right:80px;top:150px;bottom:170px;display:flex;flex-direction:column;justify-content:center">
      <div>${kicker(d.kicker)}</div>
      <h1 style="font-size:88px;margin-top:34px">${esc(d.headline)}</h1>
      <p class="sub" style="font-size:32px;margin-top:32px;max-width:900px">${esc(d.sub)}</p>
    </div>
    <div class="abs" style="left:56px;bottom:60px">${cta()}</div>`],
  question: (d) => [1080, 1350, `
    <div class="brandbg"></div>${rings(950, 200, 220)}
    <div class="abs" style="left:56px;top:52px">${brand()}</div>
    <div class="abs" style="left:56px;right:56px;top:150px;bottom:90px;display:flex;flex-direction:column;justify-content:center">
      <div>${kicker(d.kicker)}</div>
      <h1 style="font-size:76px;margin-top:30px">${esc(d.headline)}</h1>
      <div style="display:grid;gap:20px;margin-top:50px">${(d.bullets || []).map((b) => { const [l, ...r] = b.split(' — '); return `<div class="opt" style="font-size:34px;padding:28px 30px"><b style="width:56px;height:56px;font-size:26px">${esc(l)}</b>${esc(r.join(' — '))}</div>`; }).join('')}</div>
      <p class="sub" style="font-size:30px;margin-top:40px">💬 დაწერე ასო კომენტარში</p>
    </div>`],
  'story-screen': (d) => [1080, 1920, `
    <div class="brandbg"></div>${rings(540, 1150, 380)}
    <div class="abs" style="left:0;right:0;top:120px;text-align:center;display:flex;flex-direction:column;align-items:center">
      ${brand('AI')}
      <h1 style="font-size:78px;margin-top:50px;padding:0 70px">${esc(d.headline)}</h1>
      <p class="sub" style="font-size:32px;margin-top:22px;padding:0 90px">${esc(d.sub)}</p>
    </div>
    <div class="phone" style="left:300px;top:760px;width:480px;transform:rotate(-4deg)"><img src="${SCREENS}${d.screen}"></div>
    <div class="abs" style="left:0;right:0;bottom:110px;text-align:center"><span class="pill">📲 ლინკი ბიოში</span></div>`],
  'story-photo': (d) => [1080, 1920, `
    <div class="photo" style="background-image:url(${photoUrl(d.photo)})"></div>
    <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(4,24,27,.8) 0%,rgba(4,24,27,.35) 32%,rgba(4,24,27,0) 50%,rgba(4,24,27,0) 70%,rgba(4,24,27,.75) 100%)"></div>
    <div class="abs" style="left:0;right:0;top:120px;text-align:center;display:flex;flex-direction:column;align-items:center">
      ${brand('AI')}
      <div style="margin-top:44px">${kicker(d.kicker)}</div>
      <h1 style="font-size:90px;margin-top:26px;padding:0 60px">${esc(d.headline)}</h1>
      <p class="sub" style="font-size:34px;margin-top:20px;padding:0 90px">${esc(d.sub)}</p>
    </div>
    <div class="abs" style="left:0;right:0;bottom:120px;text-align:center"><span class="pill">📲 ლინკი ბიოში</span></div>`],
  'story-tip': (d) => [1080, 1920, `
    <div class="lightbg"></div>
    <div class="abs light" style="left:0;right:0;top:140px;text-align:center;display:flex;flex-direction:column;align-items:center">
      ${brand('AI · რჩევა')}
      <div class="icon" style="width:240px;height:240px;font-size:130px;margin-top:300px;border-radius:64px">${d.icon || '💡'}</div>
      <h1 style="font-size:84px;margin-top:70px;padding:0 70px">${esc(d.headline)}</h1>
      <p class="sub" style="font-size:36px;margin-top:26px;padding:0 90px">${esc(d.sub)}</p>
    </div>
    <div class="abs" style="left:0;right:0;bottom:120px;text-align:center"><span class="pill" style="background:#0F766E;color:#fff">💬 მოგვწერე</span></div>`],
  'story-statement': (d) => [1080, 1920, `
    <div class="brandbg"></div>${rings(540, 960, 330)}
    <div class="abs" style="left:0;right:0;top:140px;display:flex;justify-content:center">${brand('AI')}</div>
    <div class="abs" style="left:70px;right:70px;top:720px;text-align:center">
      <h1 style="font-size:96px">${esc(d.headline)}</h1>
      <p class="sub" style="font-size:38px;margin-top:34px">${esc(d.sub)}</p>
    </div>
    <div class="abs" style="left:0;right:0;bottom:120px;text-align:center"><span class="pill">📲 ლინკი ბიოში</span></div>`],
  'story-question': (d) => [1080, 1920, `
    <div class="brandbg"></div>${rings(540, 300, 260)}
    <div class="abs" style="left:0;right:0;top:140px;display:flex;justify-content:center">${brand('AI')}</div>
    <div class="abs" style="left:80px;right:80px;top:460px">
      <h1 style="font-size:88px;text-align:center">${esc(d.headline)}</h1>
      <div style="display:grid;gap:20px;margin-top:70px">${(d.bullets || []).map((b) => `<div class="opt" style="font-size:40px;padding:30px 36px">${esc(b)}</div>`).join('')}</div>
      <p class="sub" style="font-size:36px;margin-top:50px;text-align:center">${esc(d.sub)}</p>
    </div>`],
  'li-text': (d) => [1200, 627, `
    <div class="brandbg"></div>${rings(1010, 310, 200)}
    <div class="abs" style="left:56px;top:48px">${brand('AI health app · Georgia')}</div>
    <div class="abs" style="left:56px;right:340px;top:190px">
      <h1 style="font-size:58px" lang="en">${esc(d.headline)}</h1>
    </div>
    <img class="abs" src="${ICON}" style="right:110px;top:210px;width:200px;height:200px;border-radius:52px;box-shadow:0 30px 80px rgba(0,0,0,.35)">
    <div class="abs" style="left:56px;bottom:48px">${cta('Free', 'Georgian · English')}</div>`],
};

async function render(slot) {
  const plan = await (await fetch('plan.json')).json();
  const d = plan.find((x) => x.slot === slot);
  if (!d || !T[d.template]) { document.body.dataset.skip = '1'; return; }
  const [w, h, html] = T[d.template](d);
  const el = document.getElementById('poster');
  el.style.width = `${w}px`; el.style.height = `${h}px`;
  if (d.template === 'tip' || d.template === 'story-tip') el.classList.add('light');
  el.innerHTML = html;
  await Promise.all([...el.querySelectorAll('img')].map((i) => i.decode().catch(() => {})));
  const bgs = [...el.querySelectorAll('.photo')].map((p) => new Promise((ok) => { const i = new Image(); i.onload = i.onerror = ok; i.src = p.style.backgroundImage.slice(5, -2); }));
  await Promise.all(bgs);
  await document.fonts.ready;
  document.body.dataset.ready = '1';
}
render(new URLSearchParams(location.search).get('slot'));
</script>
</body>
</html>
