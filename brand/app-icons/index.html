<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>აპის აიქონები</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F4F3F1; --ink: #1E1B22; --muted: #6E6873; --line: #E2DFE4; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans Georgian', system-ui, sans-serif; padding: 48px 48px 56px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; }
  .lead { color: var(--muted); font-size: 14px; margin-top: 6px; }
  section { margin-top: 40px; }
  h2 { font-size: 17px; font-weight: 700; }
  h2 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px 24px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .grid.six { grid-template-columns: repeat(6, 1fr); gap: 28px 14px; }
  .grid.six .note { max-width: 180px; }
  .tile { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .face { position: relative; width: 176px; height: 176px; }
  .icon { width: 176px; height: 176px; border-radius: 22.37%; overflow: hidden; box-shadow: 0 16px 34px -18px rgba(30, 20, 40, .5); }
  .icon svg, .icon img, .mini svg, .mini img { width: 100%; height: 100%; display: block; }
  .num { position: absolute; top: -10px; left: -10px; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px var(--bg); }
  .meta { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .mini { width: 40px; height: 40px; border-radius: 22.37%; overflow: hidden; flex: none; }
  .name { font-size: 16px; font-weight: 700; }
  .note { color: var(--muted); font-size: 12.5px; line-height: 1.55; margin-top: 6px; max-width: 220px; }
  body.solo { padding: 0; background: transparent; }
  body.solo #board { display: none; }
  #solo { display: none; }
  body.solo #solo { display: block; width: 1024px; height: 1024px; }
  #solo svg { width: 1024px; height: 1024px; display: block; }
</style>
</head>

  <section><h2>ზოგადი <small>ახალი სტილები</small></h2><div class="grid" id="fresh"></div></section>

const mark = (px, fill, extra = '') => `<g transform="translate(512 512) scale(${px / 36}) translate(-42.75 -30.75)"><path fill-rule="evenodd" clip-rule="evenodd" d="${MARK}" fill="${fill}" ${extra}/></g>`;

// Georgian ჩუქურთმა: two strands interlaced around the mark, alternating over / under at every crossing.
function braid({ R, a, n, w, edge, gold, uid }) {
  const pt = (s, t) => { const r = R + s * a * Math.sin(n * t); return [512 + r * Math.cos(t), 512 + r * Math.sin(t)]; };
  const path = (s, t0, t1, steps) => { let d = ''; for (let i = 0; i <= steps; i++) { const [x, y] = pt(s, t0 + (t1 - t0) * i / steps); d += (i ? 'L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2); } return d; };
  const stroke = (d, cap = 'butt') => `<path d="${d}" fill="none" stroke="${edge}" stroke-width="${w + 12}" stroke-linecap="${cap}"/><path d="${d}" fill="none" stroke="url(#${gold})" stroke-width="${w}" stroke-linecap="${cap}"/><path d="${d}" fill="none" stroke="rgba(255,248,225,.55)" stroke-width="${w * 0.18}" stroke-linecap="${cap}" transform="translate(-1.5 -2)"/>`;
  let out = stroke(path(1, 0, 2 * Math.PI, 720) + 'Z') + stroke(path(-1, 0, 2 * Math.PI, 720) + 'Z');
  const half = Math.PI / n * 0.42;
  for (let k = 0; k < 2 * n; k++) { const t = k * Math.PI / n; out += stroke(path(k % 2 ? -1 : 1, t - half, t + half, 40)); }
  // carved beads in every eye of the braid
  for (let k = 0; k < 2 * n; k++) { const t = (k + 0.5) * Math.PI / n; const [x, y] = pt(0, t); out += `<circle cx="${x}" cy="${y}" r="${w * 0.42}" fill="${edge}"/><circle cx="${x}" cy="${y}" r="${w * 0.3}" fill="url(#${gold})"/>`; }
  return out;
}

// iOS 26 look: soft colour field, a near-white glass mark with a specular rim (Apple: keep the foreground white).
function PHONE_GLASS(p, [top, mid, deep], shade, ink = '#FFFFFF') {
  return `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${p}Bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${top}"/><stop offset=".55" stop-color="${mid}"/><stop offset="1" stop-color="${deep}"/></linearGradient>
      <radialGradient id="${p}Light" cx="30%" cy="18%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="${p}Glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ink}" stop-opacity="1"/><stop offset="1" stop-color="${ink}" stop-opacity=".82"/></linearGradient>
      <linearGradient id="${p}Rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".4" stop-color="#fff" stop-opacity=".1"/><stop offset=".85" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient>
      <filter id="${p}Drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="${shade}" flood-opacity=".45"/></filter>
    </defs>
    <rect width="1024" height="1024" fill="url(#${p}Bg)"/>
    <rect width="1024" height="1024" fill="url(#${p}Light)"/>
    <g filter="url(#${p}Drop)">${mark(600, `url(#${p}Glass)`)}</g>
    ${markRaw(600, `fill="none" stroke="url(#${p}Rim)" stroke-width="0.3"`)}
  </svg>`;
}
// 8-bit mark: sample the real logo path on a grid (evenodd, like the SVG) and draw each filled cell.
function PIXELS() {
  const ctx = document.createElement('canvas').getContext('2d');
  const path = new Path2D(MARK), N = 33, cell = 1024 / N, k = 680 / 36;
  let out = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    let hits = 0;
    for (const [dx, dy] of [[.5, .5], [.25, .25], [.75, .25], [.25, .75], [.75, .75]]) {
      const x = 42.75 + ((c + dx) * cell - 512) / k, y = 30.75 + ((r + dy) * cell - 512) / k;
      if (ctx.isPointInPath(path, x, y, 'evenodd')) hits++;
    }
    if (hits < 3) continue;
    const t = r / N, col = t < .35 ? '#5EEAD4' : t < .6 ? '#2DD4BF' : t < .8 ? '#14B8A6' : '#0D9488';
    const x = c * cell, y = r * cell;
    out += `<rect x="${x + 2}" y="${y + 2}" width="${cell - 4}" height="${cell - 4}" rx="4" fill="${col}"/><rect x="${x + 6}" y="${y + 6}" width="${cell - 22}" height="5" rx="2" fill="#fff" opacity=".35"/>`;
  }
  return `<g opacity=".18" fill="#A5B4FC">${Array.from({ length: N * N }, (_, i) => `<circle cx="${(i % N + .5) * cell}" cy="${(Math.floor(i / N) + .5) * cell}" r="2.4"/>`).join('')}</g>${out}`;
}
function MARK_T(px) { return `translate(512 512) scale(${px / 36}) translate(-42.75 -30.75)`; }
function markRaw(px, attrs) { return `<path transform="${MARK_T(px)}" d="${MARK}" ${attrs}/>`; }
function BLOBS(shift) {
  return [['#14B8A6', 300, 330, 270], ['#2563EB', 770, 290, 250], ['#A855F7', 720, 790, 270], ['#5EEAD4', 250, 820, 210], ['#F472B6', 560, 520, 130]]
    .map(([c, x, y, r]) => `<circle cx="${x + shift}" cy="${y + shift}" r="${r}" fill="${c}"/>`).join('');
}
// Night streets: a seeded grid tilted like a map; segments near the centre are lit (MEDIRUN Glow).
function CITY() {
  let seed = 7; const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const xs = [], ys = [];
  for (let v = -260; v < 1300; v += 70 + rnd() * 70) xs.push(v);
  for (let v = -260; v < 1300; v += 70 + rnd() * 70) ys.push(v);
  const segs = [];
  for (const y of ys) for (let i = 0; i + 1 < xs.length; i++) segs.push([xs[i], y, xs[i + 1], y]);
  for (const x of xs) for (let i = 0; i + 1 < ys.length; i++) segs.push([x, ys[i], x, ys[i + 1]]);
  let dim = '', lit = '', win = '';
  for (const [x1, y1, x2, y2] of segs) {
    const d = Math.hypot((x1 + x2) / 2 - 512, (y1 + y2) / 2 - 512);
    const line = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    if (rnd() < (d < 250 ? 0.55 : d < 400 ? 0.2 : 0.03)) lit += line; else dim += line;
  }
  for (let k = 0; k < 140; k++) win += `<rect x="${rnd() * 1024}" y="${rnd() * 1024}" width="5" height="5" rx="1"/>`;
  return `<g transform="rotate(-28 512 512)"><g stroke="#22344F" stroke-width="5" stroke-linecap="round">${dim}</g><g stroke="#FBBF24" stroke-width="5" stroke-linecap="round" filter="url(#kGlow)" opacity=".9">${lit}</g></g><g fill="#FCD34D" opacity=".35">${win}</g>`;
}

];
const FEMININE = ['chukurtma', 'silk', 'orchid', 'lavender', 'cherry', 'sage'], FRESH = ['glass', 'neon', 'paper', 'marble', 'city', 'holo', 'watercolor', 'puffy', 'pixel', 'topo'];
const byId = id => ICONS.find(i => i.id === id);
// ids inside repeated inline SVGs must stay unique per copy
const uniq = (svg, tag) => svg.replace(/id="(\w+)"/g, `id="$1_${tag}"`).replace(/url\(#(\w+)\)/g, `url(#$1_${tag})`);

const solo = new URLSearchParams(location.search).get('icon');
if (solo) {
  document.body.classList.add('solo');
  document.getElementById('solo').innerHTML = byId(solo).svg();
} else {
  let n = 0;
  const tile = (art, mini, name, note) => `<div class="tile"><div class="face"><div class="icon">${art}</div><div class="num">${++n}</div></div><div class="meta"><div class="mini">${mini}</div><div class="name">${name}</div></div><p class="note">${note}</p></div>`;
  document.getElementById('live').innerHTML = LIVE.map(i => tile(`<img src="${i.src}" alt="">`, `<img src="${i.src}" alt="">`, i.name, i.note)).join('');
  const drawn = ids => ids.map(id => { const i = byId(id); return tile(uniq(i.svg(), 'a'), uniq(i.svg(), 'b'), i.name, i.note); }).join('');
  document.getElementById('feminine').innerHTML = drawn(FEMININE);
  document.getElementById('fresh').innerHTML = drawn(FRESH);
}
