<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>MEDICARD AI — new modules posters</title>
<!--
  Launch posters for MEDIHOROSCOPE and MEDISLEEP (2026-10-14). poster.html?v=<variant>&fmt=feed|story
  Brand rule (owner 2026-10-13): people took module names (MEDICYCLE) for the app's name. Every creative leads
  with the app — the MEDICARD AI icon + name at the top, „App Store-ში მოძებნე „MEDICARD AI““ at the bottom —
  and a module name only ever appears as a part of MEDICARD AI („…-ის ახალი განყოფილება“).
-->
<style>
@font-face { font-family: FiraGO; src: url(fonts/FiraGO-Regular.woff2); font-weight: 400; }
@font-face { font-family: FiraGO; src: url(fonts/FiraGO-Medium.woff2); font-weight: 500; }
@font-face { font-family: FiraGO; src: url(fonts/FiraGO-SemiBold.woff2); font-weight: 600; }
@font-face { font-family: FiraGO; src: url(fonts/FiraGO-Bold.woff2); font-weight: 700; }
@font-face { font-family: FiraGO; src: url(fonts/FiraGO-ExtraBold.woff2); font-weight: 800; }
@font-face { font-family: NotoSansGeo; src: url(fonts/NotoSansGeorgian_300Light.ttf); font-weight: 300; }
@font-face { font-family: NotoSansGeo; src: url(fonts/NotoSansGeorgian_400Regular.ttf); font-weight: 400; }
@font-face { font-family: NotoSansGeo; src: url(fonts/NotoSansGeorgian_500Medium.ttf); font-weight: 500; }
@font-face { font-family: SerifGeo; src: url(fonts/noto-serif-georgian-500.ttf); font-weight: 500; }
@font-face { font-family: Exo2; src: url(fonts/exo2-800.ttf); font-weight: 800; }

:root {
  --W: 1080px; --H: 1350px;
  --ink: #F6EEDC; --mist: rgba(246, 238, 220, .74); --faint: rgba(246, 238, 220, .46);
  --accent: #E9C77E; --accent-deep: #C99A45;
  --bg1: #060A1F; --bg2: #121C52; --bg3: #24357A;
  --brand: #14B8A6;
}
.sleep {
  --ink: #F6F0FF; --mist: rgba(246, 240, 255, .76); --faint: rgba(246, 240, 255, .48);
  --accent: #F3E1A8; --accent-deep: #D9A8FF;
  --bg1: #0D0726; --bg2: #24145C; --bg3: #4B2A9E;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; }
body { width: var(--W); height: var(--H); overflow: hidden; font-family: FiraGO, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
#poster { position: relative; width: var(--W); height: var(--H); overflow: hidden;
  background: radial-gradient(120% 80% at 70% 18%, var(--bg3) 0%, var(--bg2) 34%, var(--bg1) 78%); }
canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ── The app lockup: who this is (MEDICARD AI), always top-left ─────────────── */
.lockup { position: absolute; left: 72px; top: var(--top, 72px); display: flex; align-items: center; gap: 22px; z-index: 20; }
.lockup img { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 0 1.5px rgba(255,255,255,.14); }
.lockup .name { font-weight: 800; font-size: 44px; letter-spacing: .01em; line-height: 1; color: #fff; }
.lockup .line { margin-top: 10px; font-size: 25px; color: var(--mist); line-height: 1; }
.news { position: absolute; right: 72px; top: calc(var(--top, 72px) + 24px); z-index: 20; padding: 12px 24px 13px; border-radius: 999px;
  font-weight: 600; font-size: 26px; line-height: 1; color: var(--bg1); background: var(--accent); }

/* ── Footer: where to get it ──────────────────────────────────────────────── */
.foot { position: absolute; left: 72px; right: 72px; bottom: var(--bottom, 64px); z-index: 20; display: flex; align-items: flex-end; justify-content: space-between;
  padding-top: 26px; border-top: 1.5px solid rgba(255,255,255,.16); }
.foot .find { font-size: 26px; color: var(--mist); line-height: 1.25; }
.foot .find b { display: block; font-weight: 800; font-size: 36px; color: #fff; letter-spacing: .01em; margin-top: 6px; }
.foot .site { font-weight: 600; font-size: 30px; color: var(--ink); text-align: right; line-height: 1.25; }
.foot .site small { display: block; font-weight: 400; font-size: 24px; color: var(--faint); }

/* ── Module tag: the module as a PART of the app ──────────────────────────── */
.tag { display: inline-flex; align-items: baseline; gap: 16px; font-size: 26px; color: var(--mist); white-space: nowrap; }
.wm { font-family: Exo2; font-weight: 800; font-size: 34px; letter-spacing: -.01em; color: #fff; }
.wm i { display: inline-block; font-style: normal; color: var(--accent); transform: skewX(-16deg); margin-left: .04em; }

/* ── Type ─────────────────────────────────────────────────────────────────── */
.head { position: absolute; left: 72px; right: 72px; z-index: 10; }
.h1 { font-family: SerifGeo; font-weight: 500; font-size: 112px; line-height: 1.08; letter-spacing: -.01em; color: var(--ink); }
.sleep .h1 { font-family: NotoSansGeo; font-weight: 300; letter-spacing: -.015em; }
.h2 { font-family: SerifGeo; font-weight: 500; font-size: 64px; line-height: 1.1; color: var(--accent); margin-top: 10px; }
.sleep .h2 { font-family: NotoSansGeo; font-weight: 400; }
.lede { margin-top: 28px; font-size: 34px; line-height: 1.42; color: var(--mist); max-width: 860px; }
.lede b { color: var(--ink); font-weight: 600; }

/* ── Phone ────────────────────────────────────────────────────────────────── */
.phone { position: absolute; z-index: 8; width: var(--pw); aspect-ratio: 390 / 844; border-radius: calc(var(--pw) * .145);
  background: #07070C; padding: calc(var(--pw) * .032);
  box-shadow: 0 0 0 2px rgba(255,255,255,.10), 0 40px 90px rgba(0,0,0,.55), 0 0 140px var(--glow, rgba(233,199,126,.18)); }
.phone .screen { position: relative; width: 100%; height: 100%; border-radius: calc(var(--pw) * .118); overflow: hidden; background: var(--scr, #0A1030); }
.phone .screen img { position: absolute; left: 0; top: calc(var(--pw) * .118); width: 100%; }
.phone .bar { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--pw) * .118); display: flex; align-items: center; justify-content: space-between;
  padding: 0 calc(var(--pw) * .085) 0 calc(var(--pw) * .1); font-weight: 600; font-size: calc(var(--pw) * .042); color: #fff; z-index: 2; }
.phone .island { position: absolute; top: calc(var(--pw) * .028); left: 50%; transform: translateX(-50%); width: 31%; height: calc(var(--pw) * .085); border-radius: 99px; background: #000; z-index: 3; }
.phone .bar svg { height: calc(var(--pw) * .034); fill: #fff; }

/* ── Astrolabe ────────────────────────────────────────────────────────────── */
.astro { position: absolute; z-index: 4; }
.astro svg { width: 100%; height: 100%; overflow: visible; }

/* ── Oracle ───────────────────────────────────────────────────────────────── */
.oracle { position: absolute; z-index: 9; }
.oracle svg { width: 100%; height: 100%; overflow: visible; }
.halo { position: absolute; z-index: 5; border-radius: 50%; background: radial-gradient(circle, rgba(233,199,126,.34) 0%, rgba(233,199,126,.10) 38%, transparent 66%); }
.quote { position: absolute; z-index: 10; font-family: SerifGeo; font-weight: 500; font-size: 40px; line-height: 1.36; color: var(--ink); }
.quote::before { content: '„'; color: var(--accent); }
.quote::after { content: '“'; color: var(--accent); }

/* ── Sound art ────────────────────────────────────────────────────────────── */
.mosaic { position: absolute; z-index: 4; display: grid; gap: 22px; transform: rotate(-6deg); }
.mosaic figure { position: relative; border-radius: 28px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.45); aspect-ratio: 3 / 4; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mosaic figcaption { position: absolute; left: 20px; bottom: 16px; font-weight: 600; font-size: 26px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.fade { position: absolute; z-index: 6; left: 0; right: 0; pointer-events: none; }

/* ── Moon ─────────────────────────────────────────────────────────────────── */
.moon { position: absolute; z-index: 4; border-radius: 50%;
  background: radial-gradient(circle at 38% 36%, #FFF6DA 0%, #F3E1A8 46%, #D9BE7A 100%);
  box-shadow: 0 0 120px rgba(243,225,168,.45), 0 0 300px rgba(217,168,255,.25); }
.moon .bite { position: absolute; border-radius: 50%; background: var(--bg2); }
.sleeper { position: absolute; z-index: 6; }

/* ── Sign wheel ───────────────────────────────────────────────────────────── */
.signs { position: absolute; z-index: 4; }
.signs svg { width: 100%; height: 100%; overflow: visible; }
</style>
</head>
<body>
<div id="poster"></div>
<script type="module">
import { ASTRO_GLYPHS } from './js/astroGlyphs.js';

const q = new URLSearchParams(location.search);
const V = q.get('v') || 'h1';
const STORY = q.get('fmt') === 'story', OG = q.get('fmt') === 'og';
const W = OG ? 1200 : 1080, H = OG ? 630 : STORY ? 1920 : 1350;
document.documentElement.style.setProperty('--H', `${H}px`);
document.documentElement.style.setProperty('--W', `${W}px`);
// Story safe zones: profile row + reply bar.
document.documentElement.style.setProperty('--top', STORY ? '210px' : OG ? '56px' : '72px');
document.documentElement.style.setProperty('--bottom', STORY ? '250px' : '64px');
const P = document.getElementById('poster');
const SLEEP = V.startsWith('s') || V === 'og-s';
if (SLEEP) document.body.classList.add('sleep');
const sky = await fetch('js/sky.json').then((r) => r.json());

const el = (tag, cls, html, style) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  if (style) Object.assign(n.style, style);
  return n;
};
const add = (n) => (P.appendChild(n), n);

// ── Seeded star field with a few falling stars ────────────────────────────────
function stars({ count = 260, streaks = 3, seed = 7, warm = !SLEEP } = {}) {
  const c = add(el('canvas', 'sky'));
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  let s = seed;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < count; i++) {
    const x = rnd() * W, y = rnd() * H, r = rnd() < 0.08 ? 1.6 + rnd() * 1.4 : 0.5 + rnd() * 1.1;
    const a = 0.25 + rnd() * 0.7;
    g.fillStyle = warm && rnd() < 0.25 ? `rgba(243,221,166,${a})` : `rgba(255,255,255,${a})`;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    if (r > 2.2) { // a soft glint on the brightest
      const gr = g.createRadialGradient(x, y, 0, x, y, r * 7);
      gr.addColorStop(0, `rgba(255,255,255,${a * 0.35})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 7, 0, Math.PI * 2); g.fill();
    }
  }
  for (let i = 0; i < streaks; i++) {
    const x = W * (0.15 + rnd() * 0.75), y = H * (0.05 + rnd() * 0.45), len = 160 + rnd() * 200, ang = (Math.PI / 180) * (148 + rnd() * 10);
    const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
    const gr = g.createLinearGradient(x, y, x2, y2);
    gr.addColorStop(0, 'rgba(255,248,225,.95)'); gr.addColorStop(1, 'rgba(255,248,225,0)');
    g.strokeStyle = gr; g.lineWidth = 2.2; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
    const h = g.createRadialGradient(x, y, 0, x, y, 14); h.addColorStop(0, 'rgba(255,250,230,.9)'); h.addColorStop(1, 'rgba(255,250,230,0)');
    g.fillStyle = h; g.beginPath(); g.arc(x, y, 14, 0, Math.PI * 2); g.fill();
  }
}

// ── Shared chrome ─────────────────────────────────────────────────────────────
function lockup(line = 'უფასო აპი iPhone-ისთვის') {
  add(el('div', 'lockup', `<img src="img/app-icon.png" alt=""><div><div class="name">MEDICARD AI</div><div class="line">${line}</div></div>`));
  add(el('div', 'news', 'სიახლე'));
}
function foot() {
  add(el('div', 'foot', `<div class="find">App Store-ში მოძებნე<b>MEDICARD AI</b></div><div class="site">medicard.ge<small>უფასოა</small></div>`));
}
const WM = SLEEP ? '<span class="wm">MEDI<i>SLEEP</i></span>' : '<span class="wm">MEDI<i>HOROSCOPE</i></span>';
const tag = (text = 'MEDICARD AI-ის ახალი განყოფილება') => `<div class="tag">${WM}<span>${text}</span></div>`;

// ── Phone with a real app screen ──────────────────────────────────────────────
async function topColor(src) {
  const img = new Image(); img.src = src; await img.decode();
  const c = document.createElement('canvas'); c.width = 4; c.height = 4;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, img.width, 6, 0, 0, 4, 4);
  const [r, gg, b] = g.getImageData(1, 1, 1, 1).data;
  return `rgb(${r},${gg},${b})`;
}
async function phone(screen, { x, y, w, time = '21:40', glow, rotate = 0, shift = 0 }) {
  const src = `img/screens/${screen}.png`;
  const p = add(el('div', 'phone', `<div class="screen"><div class="island"></div><div class="bar"><span>${time}</span><span>${barIcons}</span></div><img src="${src}" alt=""></div>`));
  Object.assign(p.style, { left: `${x}px`, top: `${y}px`, transform: rotate ? `rotate(${rotate}deg)` : '' });
  p.style.setProperty('--pw', `${w}px`);
  if (glow) p.style.setProperty('--glow', glow);
  p.querySelector('.screen').style.setProperty('--scr', await topColor(src));
  if (shift) p.querySelector('.screen img').style.top = `calc(var(--pw) * .118 - ${shift}px)`;
  return p;
}
const barIcons = `<svg viewBox="0 0 64 12"><rect x="0" y="8" width="3.2" height="4" rx="1"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1"/><rect x="10" y="3" width="3.2" height="9" rx="1"/><rect x="15" y="0.5" width="3.2" height="11.5" rx="1"/><path d="M30 3.2c2.6 0 5 1 6.8 2.7l-1.4 1.5A7.6 7.6 0 0 0 30 5.3a7.6 7.6 0 0 0-5.4 2.1l-1.4-1.5A9.8 9.8 0 0 1 30 3.2zm0 3.6c1.6 0 3 .6 4.1 1.6L30 12.2l-4.1-3.8A6 6 0 0 1 30 6.8z"/><rect x="42" y="1.5" width="19" height="9.5" rx="2.6" fill="none" stroke="#fff" stroke-width="1.1" opacity=".6"/><rect x="43.6" y="3.1" width="13.6" height="6.3" rx="1.5"/><rect x="62" y="4.4" width="1.6" height="3.6" rx=".8" opacity=".6"/></svg>`;

// ── Astrolabe (zodiac ring + today's planets, from the real sky) ──────────────
function glyph(key, cx, cy, size, fill) {
  const g = ASTRO_GLYPHS[key];
  if (!g) return '';
  const [vx, vy, vw, vh] = g.vb.split(' ').map(Number);
  const s = size / Math.max(vw, vh);
  return `<g transform="translate(${cx - size / 2},${cy - size / 2}) scale(${s}) translate(${-vx},${-vy})"><path d="${g.d}" fill="${fill}"/></g>`;
}
const SIGNS = ['aries', 'taurus', 'gemini', 'cancer', 'leo', 'virgo', 'libra', 'scorpio', 'sagittarius', 'capricorn', 'aquarius', 'pisces'];
function astrolabe({ x, y, size, rot = 0, planets = true, opacity = 1 }) {
  const R = 500, cx = 500, cy = 500;
  const brass = 'url(#brass)', dim = 'rgba(233,199,126,.58)', hair = 'rgba(233,199,126,.34)';
  // Ecliptic longitude → angle: Aries 0° on the left (as in charts), counter-clockwise.
  const pt = (lon, r) => { const a = Math.PI - (lon + rot) * Math.PI / 180; return [cx + Math.cos(a) * r, cy - Math.sin(a) * r]; };
  let s = `<svg viewBox="-20 -20 1040 1040"><defs>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(18,28,82,0)"/><stop offset=".7" stop-color="rgba(233,199,126,.04)"/><stop offset="1" stop-color="rgba(233,199,126,.13)"/></radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF0C4"/><stop offset=".45" stop-color="#E9C77E"/><stop offset=".72" stop-color="#B98A3A"/><stop offset="1" stop-color="#F3DDA6"/></linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <mask id="cres"><rect x="0" y="0" width="1000" height="1000" fill="#fff"/><circle cx="528" cy="486" r="58" fill="#000"/></mask>
  </defs><g filter="url(#glow)">`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#disc)" stroke="${brass}" stroke-width="5"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R - 22}" fill="none" stroke="${dim}" stroke-width="1.5"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R - 118}" fill="none" stroke="${brass}" stroke-width="2"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R - 136}" fill="none" stroke="${hair}" stroke-width="1.2"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${R - 300}" fill="none" stroke="${hair}" stroke-width="1.2"/>`;
  for (let d = 0; d < 360; d += 1) {
    const long = d % 30 === 0, mid = d % 10 === 0, five = d % 5 === 0;
    const [x1, y1] = pt(d, R - 22); const [x2, y2] = pt(d, R - 22 - (long ? 96 : mid ? 18 : five ? 12 : 6));
    if (long || five || d % 1 === 0) s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${long ? brass : five ? dim : hair}" stroke-width="${long ? 2.4 : 1.2}"/>`;
  }
  SIGNS.forEach((k, i) => { const [gx, gy] = pt(i * 30 + 15, R - 70); s += glyph(k, gx, gy, 58, '#F0D592'); });
  // aspect web between planets (only the close ones)
  if (planets) {
    const list = sky.bodies.filter((b) => ASTRO_GLYPHS[b.key]);
    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
      const d = Math.abs(((list[i].lon - list[j].lon + 540) % 360) - 180);
      const asp = [0, 60, 90, 120, 180].find((a) => Math.abs(d - a) < 5);
      if (asp === undefined || asp === 0) continue;
      const [a1, b1] = pt(list[i].lon, R - 300); const [a2, b2] = pt(list[j].lon, R - 300);
      s += `<line x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}" stroke="${asp === 90 || asp === 180 ? 'rgba(255,170,150,.45)' : 'rgba(150,200,255,.45)'}" stroke-width="1.6"/>`;
    }
    list.forEach((b, i) => {
      const r = R - 182 - (i % 2) * 54;
      const [px, py] = pt(b.lon, r);
      const [tx, ty] = pt(b.lon, R - 136); const [ux, uy] = pt(b.lon, R - 152);
      s += `<line x1="${tx}" y1="${ty}" x2="${ux}" y2="${uy}" stroke="${brass}" stroke-width="2"/>`;
      s += glyph(b.key, px, py, 50, '#FBF5E6');
      const [dx, dy] = pt(b.lon, R - 300); s += `<circle cx="${dx}" cy="${dy}" r="5" fill="#F0D592"/>`;
    });
  }
  // centre: a crescent Moon
  s += `</g><circle cx="${cx}" cy="${cy}" r="120" fill="rgba(243,225,168,.07)"/><g style="filter:drop-shadow(0 0 22px rgba(243,225,168,.75))"><circle cx="${cx}" cy="${cy}" r="66" fill="#F3E1A8" mask="url(#cres)"/></g>`;
  s += `</svg>`;
  const n = add(el('div', 'astro', s));
  Object.assign(n.style, { left: `${x}px`, top: `${y}px`, width: `${size}px`, height: `${size}px`, opacity });
  return n;
}

// ── Oracle (Medi in the witch hat, the app's own vector) ──────────────────────
async function oracle({ x, y, h }) {
  const svg = await fetch('img/oracle.svg').then((r) => r.text());
  const n = add(el('div', 'oracle', svg.replace(/^<svg[^>]*?width="[^"]*"\s*height="[^"]*"/, '<svg')));
  Object.assign(n.style, { left: `${x}px`, top: `${y}px`, height: `${h}px`, width: `${h * 2288 / 2770}px` });
  return n;
}

// ── Variants ──────────────────────────────────────────────────────────────────
const V_ = {
  // H1 — the astrolabe: the real sky of the day, huge, cropped off the right edge.
  async h1() {
    stars({ count: 300, streaks: 2, seed: 11 });
    const size = STORY ? 1080 : 1100, cy = STORY ? 830 : 470;
    astrolabe({ x: W / 2 - size / 2, y: cy - size / 2, size, rot: 12 });
    add(el('div', 'fade', '', { top: 0, height: '260px', background: 'linear-gradient(180deg, rgba(6,10,31,.85) 0%, rgba(6,10,31,0) 100%)' }));
    const f0 = STORY ? 940 : 500;
    add(el('div', 'fade', '', { top: `${f0}px`, height: `${H - f0}px`, background: 'linear-gradient(180deg, rgba(6,10,31,0) 0%, rgba(6,10,31,.9) 34%, #060A1F 62%)' }));
    lockup();
    add(el('div', 'head', `${tag()}<div class="h1" style="margin-top:24px;font-size:${STORY ? 104 : 112}px">ჰოროსკოპი<br>MEDICARD AI-ში</div><div class="lede">ყოველდღე ახალი — დაწერილი პლანეტების <b>რეალური მდებარეობით</b>.${STORY ? '' : ' დღის, კვირის, თვისა და წლის ჰოროსკოპი, ნატალური რუკა და ტარო.'}</div>`,
      { top: `${STORY ? 1110 : 676}px` }));
    foot();
  },
