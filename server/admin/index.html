<!DOCTYPE html>
<html lang="ka" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Medicard Control</title>
  <script>
    (function () {
      var token = localStorage.getItem('medicard.admin.token');
      var theme = localStorage.getItem('medicard.admin.theme');
      if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.ready = token ? 'app' : 'login';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./admin.css?v=users7" />
</head>
<body>
  <div id="login-view" class="login-shell">
    <aside class="login-rail">
      <a class="logo-mark" href="#" aria-hidden="true" onclick="return false">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </a>
      <p class="rail-kicker">Medicard.GE</p>
      <h1>Control</h1>
      <p class="rail-copy">ოპერაციული კონსოლი — მომხმარებლები, პაკეტები, ფარმაცია და აპის რეჟიმი.</p>
      <ul class="rail-list">
        <li data-icon="users">ცოცხალი ცხრილები და ფილტრები</li>
        <li data-icon="layers">პაკეტის მინიჭება ერთი კლიკით</li>
        <li data-icon="pill">აფთიაქების სინქრონიზაცია</li>
      </ul>
    </aside>
    <form id="login-form" class="login-card" autocomplete="on">
      <p class="kicker">შესვლა</p>
      <h2>ადმინისტრატორი</h2>
      <label class="field">
        <span>ელ-ფოსტა</span>
        <input id="login-email" type="email" required value="admin@medicard.ge" />
      </label>
      <label class="field">
        <span>პაროლი</span>
        <input id="login-password" type="password" required placeholder="••••••••" />
      </label>
      <p id="login-error" class="error hidden"></p>
      <button type="submit" class="btn primary wide" data-icon="arrow">შესვლა კონსოლში</button>
    </form>
  </div>

  <div id="app-view" class="app">
    <div id="sidebar-scrim" class="sidebar-scrim" aria-hidden="true"></div>
    <aside class="sidebar ng-sidebar" id="sidebar">
      <div class="sidebar-logo">
        <a class="logo-mark" href="#" aria-label="Medicard Control" onclick="return false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </a>
      </div>
      <nav class="sidebar-nav" aria-label="მთავარი მენიუ">
        <button data-tab="overview" class="nav active" data-icon="layout" title="მიმოხილვა"><span class="nav-label">მიმოხილვა</span></button>
        <button data-tab="users" class="nav" data-icon="users" title="მომხმარებლები"><span class="nav-label">მომხმარებლები</span></button>
        <button data-tab="packages" class="nav" data-icon="layers" title="პაკეტები"><span class="nav-label">პაკეტები</span></button>
        <button data-tab="push" class="nav" data-icon="bell" title="Push"><span class="nav-label">Push</span></button>
        <button data-tab="sms" class="nav" data-icon="send" title="SMS"><span class="nav-label">SMS</span></button>
        <span class="nav-spacer" aria-hidden="true"></span>
        <button data-tab="pharmacy" class="nav" data-icon="pill" title="ფარმაცია"><span class="nav-label">ფარმაცია</span></button>
        <span class="nav-spacer" aria-hidden="true"></span>
        <button data-tab="ai" class="nav" data-icon="spark" title="AI ხარისხი"><span class="nav-label">AI</span></button>
        <button data-tab="settings" class="nav" data-icon="settings" title="აპის რეჟიმი"><span class="nav-label">რეჟიმი</span></button>
      </nav>
      <div class="sidebar-foot">
        <div class="sidebar-avatar" id="sidebar-avatar" title="ადმინისტრატორი">M</div>
        <button id="theme-toggle" class="foot-icon" type="button" data-icon="sun" title="თემა"></button>
        <button id="logout" class="foot-icon" type="button" data-icon="logout" title="გასვლა"></button>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar ng-topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle" class="btn icon-only ghost mobile-only" type="button" data-icon="layout" aria-label="მენიუ"></button>
          <div class="topbar-copy">
            <h2 id="page-greeting">მიმოხილვა</h2>
            <p id="page-subtitle" class="topbar-sub muted">ოპერაციული მიმოხილვა</p>
          </div>
        </div>
        <div class="topbar-right">
          <div id="live-pill" class="status-pill ok">სისტემა აქტიურია</div>
          <div id="admin-chip" class="who"></div>
        </div>
      </header>

      <section id="tab-overview" class="panel"><div class="empty">იტვირთება…</div></section>
      <section id="tab-users" class="panel hidden"></section>
      <section id="tab-packages" class="panel hidden"></section>
      <section id="tab-push" class="panel hidden"></section>
      <section id="tab-sms" class="panel hidden"></section>
      <section id="tab-pharmacy" class="panel hidden"></section>
      <section id="tab-ai" class="panel hidden"></section>
      <section id="tab-settings" class="panel hidden"></section>
    </div>
  </div>

  <div id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer-panel" id="drawer-body"></aside>
  </div>

  <div id="toasts" class="toasts"></div>
  <script src="./admin.js?v=users7"></script>
</body>
</html>
