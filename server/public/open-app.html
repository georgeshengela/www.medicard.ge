<!DOCTYPE html>
<html lang="ka" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>გახსენით მედიქარდში</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="/landing.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="hero" style="min-height:70vh;display:flex;align-items:center">
    <div class="wrap" style="max-width:560px">
      <p class="kicker">Medicard.GE</p>
      <h1 style="max-width:none;font-size:32px">გახსენით Medicard-ში</h1>
      <p class="lead">
        პარტნიორის ციკლის ხედვა მხოლოდ აპშია. დააყენეთ Medicard, შედით <strong>თქვენი</strong> ანგარიშით
        (არა მისი), შემდეგ დააჭირეთ ღილაკს.
      </p>
      <div class="hero-actions">
        <a class="btn btn-cta" id="open-app" href="#">გახსენით Medicard-ში</a>
        <a class="btn btn-ghost" href="/">საიტზე დაბრუნება</a>
      </div>
      <p class="lead" id="open-hint" style="margin-top:18px;font-size:14px"></p>
    </div>
  </main>
  <script src="/landing.js"></script>
  <script>
    (function () {
      var match = location.pathname.match(/\/share\/cycle\/([a-f0-9]{64})/i);
      var code = match ? match[1].toLowerCase() : '';
      var btn = document.getElementById('open-app');
      var hint = document.getElementById('open-hint');
      if (!code) {
        btn.href = '/';
        btn.textContent = 'საიტზე დაბრუნება';
        hint.textContent = 'ბმული არასრულია. სთხოვეთ პარტნიორს ხელახლა გაგზავნას.';
        return;
      }
      var deep = 'medicard://share/cycle/' + code;
      var android = /android/i.test(navigator.userAgent);
      btn.href = android
        ? 'intent://share/cycle/' + code + '#Intent;scheme=medicard;package=ge.medicard.app;end'
        : deep;
      hint.textContent = 'თუ აპი არ გაიხსნა, გახსენით Medicard ხელით და ისევ დააჭირეთ ამ ღილაკს.';
    })();
  </script>
</body>
</html>
