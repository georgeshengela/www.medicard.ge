<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MEDIBOOK ბიზნესი — მედიქარდი</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#f5f7f7" />
  <link rel="icon" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="preload" href="/fonts/firago/FiraGO-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/firago/FiraGO-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/firago/FiraGO-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/firago/FiraGO-ExtraBold.woff2" as="font" type="font/woff2" crossorigin />
  <script>
    // Apply the theme before first paint (no flash). Same key as /app so one choice follows the person.
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('medicard.web.theme') || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
    // The public page (/business) holds the sign-in box: a signed-out visit goes there before the app loads
    // (the panel root to the page itself, a deeper path onto the box). main.js renderLanding() does the same
    // redirect for a sign-out inside the panel or an expired token.
    (function () {
      var token = null;
      try { token = localStorage.getItem('medicard.web.token'); } catch (e) {}
      // ?p=1 matters: before the landing existed, /business answered with a 301 to /business/ and browsers cache
      // that redirect for good — a bare /business would bounce straight back here and loop. A query string is a
      // different cache key, so it always reaches the page; landing.js drops it from the address bar.
      if (!token) location.replace('/business?p=1' + (location.hash || (location.pathname === '/business/' ? '' : '#signin')));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/app.css" />
  <link rel="stylesheet" href="/business/business.css" />
</head>
<body class="biz">
  <div id="root"><div class="boot"><img class="boot-mark" src="/icon.png" alt="მედიქარდი" /></div></div>
  <noscript>MEDIBOOK ბიზნეს-პანელს JavaScript სჭირდება. / The MEDIBOOK business panel needs JavaScript.</noscript>
  <script type="module" src="/business/js/main.js"></script>
</body>
</html>
