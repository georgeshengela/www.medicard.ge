<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MEDIRUN</title>
<!--
  MEDIRUN app lobby (owner 2026-10-09: „დაწყება“ as a game lobby): the /medirun 3D city (hero3d.js, unchanged) as the
  full-screen background of the app's Start section. The app's WebView passes ?band=0.56 — the share of the screen
  the city may use above the app's own copy and buttons — and listens for {type:'ready'|'fail'}. Nothing here is
  interactive; the app draws every control natively.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050B16; }
  .hero { position: relative; height: 100vh; box-sizing: border-box; padding-top: 56vh;
    background: radial-gradient(110% 62% at 50% 30%, #0F2C3C 0%, #0A1A2C 42%, #050B16 78%); }
  .hero-3d { position: absolute; left: 0; top: 0; width: 100%; display: block; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; }
  .hero.is-3d .hero-3d { opacity: 1; }
  /* Soft floor glow under the floating block and a fade into the app's night background. */
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(48% 14% at 50% 52%, rgba(20, 184, 166, .16), rgba(20, 184, 166, 0) 70%); }
  /* hero3d's canvas ends at band + 10vw: melt that edge into the night below. */
  .fade { position: absolute; left: 0; right: 0; height: 34vh; top: calc(var(--band, 56vh) + 10vw - 30vh); pointer-events: none; z-index: 2;
    background: linear-gradient(180deg, rgba(5, 11, 22, 0) 0%, rgba(5, 11, 22, .85) 70%, #050B16 100%); }
  .low { position: absolute; left: 0; right: 0; bottom: 0; top: calc(var(--band, 56vh) + 10vw - 2px); background: #050B16; z-index: 2; }
</style>
</head>
<body>
<div class="hero"><div class="fade"></div><div class="low"></div></div>
<script>
  (function () {
    var band = parseFloat(new URLSearchParams(location.search).get('band'));
    if (band > 0.3 && band < 0.9) { var h = document.querySelector('.hero'); h.style.paddingTop = (band * 100) + 'vh'; h.style.setProperty('--band', (band * 100) + 'vh'); }
    function post(msg) { try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(msg)); } catch (e) {} }
    var hero = document.querySelector('.hero'), done = false;
    new MutationObserver(function () { if (!done && hero.classList.contains('is-3d')) { done = true; post({ type: 'ready' }); } }).observe(hero, { attributes: true });
    // No WebGL2, reduced motion or a load error: hero3d never starts — the app keeps its still picture.
    setTimeout(function () { if (!done) post({ type: 'fail' }); }, 15000);
    window.addEventListener('error', function () { if (!done) post({ type: 'fail' }); });
  })();
</script>
<script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js" } }</script>
<script type="module" src="/medirun/hero3d/hero3d.js?v=3"></script>
</body>
</html>
