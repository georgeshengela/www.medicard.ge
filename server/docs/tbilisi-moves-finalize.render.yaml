# თბილისი მოძრაობს — prepared Render cron (NOT registered)
#
# Live production `render.yaml` currently has only `medicard-pharmacy-sync`.
# Copy the block below into the repo root render.yaml `services:` list to
# enable automatic finalization. Do not paste it until the owner wants
# automatic daily results. Keep `pilotMode=true`.
#
# Use the Neon **direct** host (not -pooler) so pg_try_advisory_lock is
# session-scoped on this worker. Limit 8 due rounds per scan. Catch-up
# only selects existing PROVISIONAL rows whose own snapshotted graceEndsAt
# is due. It does not invent missing dates.
#
# Proposed scan: every 15 minutes because lateSyncGraceHours is 1–24h.
#
#   - type: cron
#     name: medicard-tbilisi-moves-finalize
#     runtime: node
#     plan: starter
#     region: frankfurt
#     branch: main
#     schedule: "*/15 * * * *"
#     buildCommand: npm --prefix server ci --include=dev && npm --prefix server run prisma:generate
#     startCommand: node server/scripts/tbilisi-moves-finalize.js --limit 8
#     envVars:
#       - key: NODE_VERSION
#         value: "20"
#       - key: NODE_ENV
#         value: production
#       - key: TBILISI_MOVES_FINALIZE_SCHEDULED
#         value: "true"
#       - key: DATABASE_URL
#         sync: false
#
# Smoke after first run (do not invent history):
#   Render cron logs JSON with scanned/processed/failed
#   Admin #/tbilisi-moves?tab=rounds shows FINALIZED only for due dates
# Rollback: delete the cron service; live rankings stay PROVISIONAL until
# an admin finalizes by hand.

name: medicard-tbilisi-moves-finalize
schedule: "*/15 * * * *"
startCommand: node server/scripts/tbilisi-moves-finalize.js --limit 8
automaticExecutionConfigured: false
